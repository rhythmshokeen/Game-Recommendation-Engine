[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gamerec"
version = "0.1.0"
description = "End-to-End Steam Game Recommendation Engine"
authors = [{ name = "ML Engineering Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "streamlit>=1.35.0",
    "matplotlib>=3.8.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
